name: AGENTRA - Jackson
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What should Jackson build in this repository?'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  jackson:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Jackson and independent reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_TASK: ${{ inputs.task }}
        run: python -m agentra.jackson
      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: agentra/jackson-${{ github.run_id }}-${{ github.run_attempt }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          test -s .agentra/report.md
          git diff --check
          git switch -c "$BRANCH"
          git add -A -- . ':!.agentra' ':!.github/workflows'
          if git diff --cached --quiet; then
            echo 'No eligible changes; see the workflow log.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AGENTRA: implement project request'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title 'AGENTRA: project request' --body-file .agentra/report.md
